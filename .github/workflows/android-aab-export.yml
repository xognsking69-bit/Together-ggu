name: Export Togetrip Android bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Download completed EAS Android build
        working-directory: trip-split-app
        env:
          BUILD_ID: 57b0cd19-d008-44b0-9ae9-bc4f78caf131
        run: |
          set -euo pipefail
          npm ci
          eas init --account susysisu --non-interactive
          if ! eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"; then
            echo "Build lookup failed; recent Android build summary:"
            eas build:list --platform android --limit 5 --json | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{for(const b of JSON.parse(d)) console.log(JSON.stringify({id:b.id,status:b.status,appVersion:b.appVersion,appBuildVersion:b.appBuildVersion}));})'
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/build.json', 'utf8'));
          const status = String(b.status || '').toLowerCase();
          const platform = String(b.platform || '').toLowerCase();
          const url = b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl;
          console.log(JSON.stringify({id: b.id, status: b.status, platform: b.platform, appVersion: b.appVersion, appBuildVersion: b.appBuildVersion}));
          if (status !== 'finished' || platform !== 'android' || !url) throw Error('Android build is not finished or has no artifact');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/artifact-url', url);
          NODE
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/togetrip-3.28.19-39.aab" "$(cat "$RUNNER_TEMP/artifact-url")"
          file "$RUNNER_TEMP/togetrip-3.28.19-39.aab"
          unzip -t "$RUNNER_TEMP/togetrip-3.28.19-39.aab" | tail -1
          ls -lh "$RUNNER_TEMP/togetrip-3.28.19-39.aab"
      - name: Upload Android app bundle
        uses: actions/upload-artifact@v4
        with:
          name: togetrip-3.28.19-39-aab
          path: ${{ runner.temp }}/togetrip-3.28.19-39.aab
          if-no-files-found: error
          retention-days: 7
