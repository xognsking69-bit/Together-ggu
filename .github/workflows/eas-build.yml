name: Togetrip EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

      profile:
        description: Advertising mode
        required: true
        default: production
        type: choice
        options:
          - production
          - production-ads

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS production build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trip-split-app/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: trip-split-app
        run: npm ci

      - name: Link the existing EAS project
        working-directory: trip-split-app
        run: eas init --account susysisu --non-interactive

      - name: Verify Expo configuration
        working-directory: trip-split-app
        env:
          EAS_BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const eas = require('./eas.json');
          const profile = process.env.EAS_BUILD_PROFILE;
          const env = { ...process.env, ...(eas.build[profile].env || {}) };
          const config = JSON.parse(execFileSync('npx', ['expo', 'config', '--type', 'introspect', '--json'], { env, encoding: 'utf8' }));
          assert.equal(config.version, require('./package.json').version, 'App and package versions must match');
          if (profile === 'production-ads') {
            const plist = config._internal?.modResults?.ios?.infoPlist;
            assert.ok(plist, 'Generated iOS Info.plist must be available');
            assert.equal(plist.NSUserTrackingUsageDescription, undefined, 'Non-personalized ads must not request ATT/IDFA');
            assert.equal(plist.GADApplicationIdentifier, env.TOGETRIP_ADMOB_IOS_APP_ID, 'Live iOS AdMob ID must match');
          }
          console.log('Verified release', config.version, 'iOS build', config.ios.buildNumber, 'ads profile', profile);
          NODE

      - name: Start production build on EAS
        working-directory: trip-split-app
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
