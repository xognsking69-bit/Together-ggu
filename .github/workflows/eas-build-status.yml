name: Togetrip EAS Build Status

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Optional EAS iOS submission ID to inspect
        required: false
        type: string
      build_id:
        description: EAS build ID to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trip-split-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: trip-split-app
        run: npm ci
      - name: Check build status
        working-directory: trip-split-app
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/build.json', 'utf8'));
          console.log(JSON.stringify({
            id: b.id,
            status: b.status,
            platform: b.platform,
            appVersion: b.appVersion,
            appBuildVersion: b.appBuildVersion,
            error: b.error,
          }, null, 2));
          NODE
      - name: Inspect failed Android Gradle phase
        if: ${{ inputs.build_id == '86380f93-a5f8-4eb2-ad11-7491cbd412a8' }}
        working-directory: trip-split-app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/build.json', 'utf8'));
          console.log('Build log metadata:', { keys: Object.keys(b), fileCount: b.logFiles?.length ?? 0 });
          (async () => {
            for (const [index, file] of (b.logFiles || []).entries()) {
              const url = typeof file === 'string' ? file : file?.url;
              if (!url) continue;
              const response = await fetch(url);
              const body = await response.text();
              console.log('Log file', index, 'HTTP', response.status, 'bytes', body.length);
              if (!response.ok) continue;
              const entries = body.split(String.fromCharCode(10)).flatMap(line => { try { return [JSON.parse(line)]; } catch { return []; } });
              const gradle = entries.filter(e => e.phase === 'RUN_GRADLEW');
              console.log('Gradle messages near failure:', gradle.slice(-65).map(e => e.msg).join(String.fromCharCode(10)));
            }
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
      - name: Check iOS submission status
        if: ${{ inputs.submission_id != '' }}
        working-directory: trip-split-app
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          eas submit:list --platform ios --limit 10 --json > "$RUNNER_TEMP/submissions.json"
          node <<'NODE'
          const fs = require('fs');
          const submissions = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/submissions.json', 'utf8'));
          const b = submissions.find(s => s.id === process.env.SUBMISSION_ID);
          if (!b) throw new Error('Submission ID not in recent 10');
          console.log(JSON.stringify({ id: b.id, status: b.status, platform: b.platform, error: b.error }, null, 2));
          NODE
