name: Togetrip EAS Build Status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trip-split-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: trip-split-app
        run: npm ci
      - name: Check build status
        working-directory: trip-split-app
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/build.json', 'utf8'));
          console.log(JSON.stringify({
            id: b.id,
            status: b.status,
            platform: b.platform,
            appVersion: b.appVersion,
            appBuildVersion: b.appBuildVersion,
            error: b.error,
          }, null, 2));
          NODE
      - name: Inspect failed Android Gradle phase
        if: ${{ inputs.build_id == '86380f93-a5f8-4eb2-ad11-7491cbd412a8' }}
        working-directory: trip-split-app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/build.json', 'utf8'));
          console.log('Build log metadata:', { keys: Object.keys(b), fileCount: b.logFiles?.length ?? 0 });
          (async () => {
            for (const [index, file] of (b.logFiles || []).entries()) {
              const url = typeof file === 'string' ? file : file?.url;
              if (!url) continue;
              const response = await fetch(url);
              const body = await response.text();
              console.log('Log file', index, 'HTTP', response.status, 'bytes', body.length);
              if (!response.ok) continue;
              const lines = body.split(String.fromCharCode(10));
              const hits = lines.map((line, i) => /FAILURE:|What went wrong|error:|ERROR|Execution failed|Could not resolve|failed with an exception/i.test(line) ? i : -1).filter(i => i >= 0);
              for (const i of hits.slice(-25)) {
                const safe = lines.slice(Math.max(0, i - 1), Math.min(lines.length, i + 3)).join(' | ');
                console.log('Log line', i, safe.slice(0, 1000));
              }
            }
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
